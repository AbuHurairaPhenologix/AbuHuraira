# Eclipse Mosquitto configuration for AutoSphere development.
#
# SECURITY NOTE: anonymous access is enabled for the local development/demo stack only.
# For any shared or production deployment enable authentication (password_file or a plugin),
# TLS on port 8883 and topic ACLs per vehicle (see docs/architecture/security.md).

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
max_queued_messages 5000
